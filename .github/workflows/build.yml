name: Build calendar

on:
  schedule:
    # 06:00 and 18:00 UTC. Catches results the morning after a match.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # tomllib needs 3.11 or newer.
          python-version: "3.12"

      - name: Build calendar
        run: python3 scripts/build_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update fixtures and table"
          git push
